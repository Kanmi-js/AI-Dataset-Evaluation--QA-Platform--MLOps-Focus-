# Nginx config for the production frontend image.
# Serves the compiled SPA and reverse-proxies API calls to the backend service.

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow reasonably large dataset uploads through the proxy.
    client_max_body_size 30m;

    # API + docs -> FastAPI backend.
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: any unmatched route serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
