name: Deploy

# Builds both images, pushes them to ECR, and rolls the running stack on the
# EC2 instance over SSM. No SSH key and no long-lived AWS credentials: the job
# exchanges its GitHub OIDC token for a short-lived role session.
#
# Required repository configuration (terraform apply prints all of these):
#   secret  AWS_DEPLOY_ROLE_ARN   github_deploy_role_arn output
#   var     AWS_REGION            defaults to us-east-1
#   var     PROJECT               defaults to mlops-qa     (must match tfvars)
#   var     ENVIRONMENT           defaults to prod         (must match tfvars)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag to roll back to. Leave empty to build from this commit."
        required: false
        type: string

# Never let two deploys touch the instance at once. Not cancel-in-progress: a
# half-applied migration is worse than a queued deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write # OIDC
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  NAME_PREFIX: ${{ vars.PROJECT || 'mlops-qa' }}-${{ vars.ENVIRONMENT || 'prod' }}

jobs:
  # Gate. Reuses ci.yml rather than duplicating it, so main can never deploy
  # something that would fail a pull request.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      skip_docker_build: true

  build:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: ci

    outputs:
      image_tag: ${{ steps.tag.outputs.value }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        # A manual run can name an already-built tag to roll back to; otherwise
        # the commit SHA is the tag, so what is deployed is always traceable to
        # a commit.
        run: echo "value=${{ inputs.image_tag || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Skip build when rolling back
        id: rollback
        # The named tag already exists in ECR; rebuilding it would replace a
        # known-good image with a fresh build of different source.
        run: echo "skip=${{ inputs.image_tag != '' }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.rollback.outputs.skip != 'true'

      - name: Build and push backend
        if: steps.rollback.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          # `latest` matters beyond convenience: if the ASG replaces the
          # instance, the new one boots with var.image_tag (latest) from
          # user-data, so latest must point at current code.
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.NAME_PREFIX }}/backend:${{ steps.tag.outputs.value }}
            ${{ steps.ecr.outputs.registry }}/${{ env.NAME_PREFIX }}/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        if: steps.rollback.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.NAME_PREFIX }}/frontend:${{ steps.tag.outputs.value }}
            ${{ steps.ecr.outputs.registry }}/${{ env.NAME_PREFIX }}/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Roll the instance
    runs-on: ubuntu-latest
    needs: build

    # Configure a "production" environment in repo settings to require manual
    # approval before this job runs.
    environment:
      name: production
      url: ${{ steps.health.outputs.app_url }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find the running instance
        id: instance
        run: |
          set -euo pipefail

          instance_id=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:aws:autoscaling:groupName,Values=${NAME_PREFIX}-app" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          if [ -z "$instance_id" ] || [ "$instance_id" = "None" ]; then
            echo "::error::No running instance in ASG ${NAME_PREFIX}-app."
            exit 1
          fi

          echo "Deploying to $instance_id"
          echo "id=$instance_id" >> "$GITHUB_OUTPUT"

      - name: Pull, migrate, restart
        id: ssm
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          INSTANCE_ID: ${{ steps.instance.outputs.id }}
        run: |
          set -euo pipefail

          account_id=$(aws sts get-caller-identity --query Account --output text)
          registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          # Mirrors the boot sequence in infrastructure/ec2/user-data.sh.tftpl:
          # migrations run in a one-shot container before the new API starts, so
          # a failing migration leaves the old stack serving.
          #
          # Quoted heredoc so nothing expands on the runner; the values the
          # script needs are substituted explicitly below.
          cat > deploy.sh <<'SCRIPT'
          set -euo pipefail
          cd /opt/mlops-qa
          export BACKEND_IMAGE="__REGISTRY__/__PREFIX__/backend"
          export FRONTEND_IMAGE="__REGISTRY__/__PREFIX__/frontend"
          export IMAGE_TAG="__TAG__"
          aws ecr get-login-password --region __REGION__ \
            | docker login --username AWS --password-stdin __REGISTRY__
          docker compose pull
          docker compose run --rm --no-deps -T migrate
          docker compose up -d --remove-orphans
          docker image prune -f
          SCRIPT

          sed -i \
            -e "s|__REGISTRY__|${registry}|g" \
            -e "s|__PREFIX__|${NAME_PREFIX}|g" \
            -e "s|__TAG__|${IMAGE_TAG}|g" \
            -e "s|__REGION__|${AWS_REGION}|g" \
            deploy.sh

          # AWS-RunShellScript takes `commands` as a list of strings, so the
          # script goes in as one line per element. Building the JSON with jq
          # keeps quoting out of the shell's hands entirely.
          jq -Rs 'split("\n") | {commands: .}' deploy.sh > params.json

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${IMAGE_TAG}" \
            --parameters file://params.json \
            --timeout-seconds 900 \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command: $command_id"

          # The waiter fails the step on a non-zero exit inside the instance,
          # which is what makes a failed migration fail the deploy.
          set +e
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID"
          waiter_status=$?
          set -e

          echo "--- Command output ---"
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text

          if [ $waiter_status -ne 0 ]; then
            echo "::error::Deploy command failed on the instance."
            echo "--- stderr ---"
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --query 'StandardErrorContent' --output text
            exit 1
          fi

      - name: Verify through the load balancer
        id: health
        # Checking localhost on the instance would pass even if the target group
        # never marked it healthy. Going through the ALB tests what users hit.
        run: |
          set -euo pipefail

          dns=$(aws elbv2 describe-load-balancers \
            --names "${NAME_PREFIX}-alb" \
            --query 'LoadBalancers[0].DNSName' --output text)

          url="http://${dns}"
          echo "app_url=${url}" >> "$GITHUB_OUTPUT"

          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 "${url}/api/v1/health" > /dev/null; then
              echo "Healthy after ${attempt} attempt(s): ${url}"
              exit 0
            fi
            sleep 10
          done

          echo "::error::${url} did not return a healthy response within 5 minutes."
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`${{ needs.build.outputs.image_tag }}\` |"
            echo "| Instance | \`${{ steps.instance.outputs.id }}\` |"
            echo "| URL | ${{ steps.health.outputs.app_url }} |"
            echo "| Result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
