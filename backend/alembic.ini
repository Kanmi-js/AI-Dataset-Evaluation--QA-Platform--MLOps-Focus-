# Alembic configuration.
#
# The database URL is NOT set here — `migrations/env.py` reads it from
# `app.config.settings.database_url_sync` so that migrations and the running
# application can never disagree about which database they target.
#
#   alembic revision --autogenerate -m "describe change"
#   alembic upgrade head
#   alembic downgrade -1

[alembic]
script_location = migrations
prepend_sys_path = .

# Timestamped, readable revision filenames: 20260911_1430-ab12cd34_add_x.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
